<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Full-bleed OPAQUE background — Android/iOS home-screen icons don't support transparency reliably,
       so this must be solid. The OS applies its own shape mask (circle/squircle/rounded-square) on top. -->
  <rect x="0" y="0" width="512" height="512" fill="#EBF2FA"/>

  <!-- 2x2 tile grid, scaled to ~50% of canvas — very conservative safe-zone sizing so aggressive
       OEM launchers (which zoom/crop well beyond the official 66% safe zone) don't clip the tiles.
       Same colors/ratio as the original design. -->
  <rect x="128" y="128" width="110" height="110" rx="21" fill="#CAF0F8" stroke="#D9E3EE" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="274" y="128" width="110" height="110" rx="21" fill="#90E0EF" stroke="#D9E3EE" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="128" y="274" width="110" height="110" rx="21" fill="#00B4D8" stroke="#D9E3EE" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="274" y="274" width="110" height="110" rx="21" fill="#0077B6" stroke="#D9E3EE" stroke-width="2" filter="url(#softShadow)"/>
</svg>
