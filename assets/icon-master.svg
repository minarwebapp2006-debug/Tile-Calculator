<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Full-bleed OPAQUE background — Android/iOS home-screen icons don't support transparency reliably,
       so this must be solid. The OS applies its own shape mask (circle/squircle/rounded-square) on top. -->
  <rect x="0" y="0" width="512" height="512" fill="#EBF2FA"/>

  <!-- 2x2 tile grid, scaled to ~62% of canvas so it stays inside Android's adaptive-icon safe zone (66%)
       and doesn't get cropped by aggressive launcher masks. Same colors/ratio as the original design. -->
  <rect x="98" y="98" width="136" height="136" rx="26" fill="#CAF0F8" stroke="#D9E3EE" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="279" y="98" width="136" height="136" rx="26" fill="#90E0EF" stroke="#D9E3EE" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="98" y="279" width="136" height="136" rx="26" fill="#00B4D8" stroke="#D9E3EE" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="279" y="279" width="136" height="136" rx="26" fill="#0077B6" stroke="#D9E3EE" stroke-width="2" filter="url(#softShadow)"/>
</svg>
